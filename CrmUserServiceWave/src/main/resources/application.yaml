spring:
  application:
    name: HRMS_Pandoza

  datasource:
    url: jdbc:mysql://localhost:3306/CrmUserService
    username: root 
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        enable_lazy_load_no_trans: true

  servlet:
    multipart:
      enabled: true
      location: /var/www/images/HrmsDocuments
      max-file-size: 2MB
      max-request-size: 50MB
        

  mail:
    host: smtp.zoho.in
    port: 587
    username: info@pandozasolutions.com
    password: XkUHPhE9YX6q
    properties:
      mail:  
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 9004

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

logging:
   level:
     com.netflix.discovery: DEBUG
     org.springframework.cloud.netflix.eureka: DEBUG

jwt:
  secret: Pandoza_Admin

# WebAuthn/passkey settings. Override these environment variables for each environment.
hrms:
  webauthn:
    rp-id: ${HRMS_WEBAUTHN_RP_ID:pandozasolutions.com}
    rp-name: ${HRMS_WEBAUTHN_RP_NAME:Pandoza HRMS}
    origin: ${HRMS_WEBAUTHN_ORIGIN:https://hrms.pandozasolutions.com}
    # For production, retain secure=true, SameSite=None and the shared parent domain.
  auth-cookie:
    domain: ${HRMS_COOKIE_DOMAIN:.pandozasolutions.com}
    secure: ${HRMS_COOKIE_SECURE:true}
    same-site: ${HRMS_COOKIE_SAME_SITE:None}
